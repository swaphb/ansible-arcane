[[rules]]
id = "arcane-plaintext-database-url"
description = "Unencrypted arcane_database_url containing credentials in YAML"
regex = '''(?i)^\s*arcane_database_url\s*:\s*["']?(postgres(?:ql)?://[^:\s]+:[^@\s]+@[^\s"'#]+)["']?'''
path = '''\.ya?ml(\.example)?$'''
secretGroup = 1
keywords = ["arcane_database_url"]

[allowlist]
description = "Allow synthetic test fixtures used by CI validation scripts"
paths = [
  '''^scripts/validate-compose-variants\.py$''',
]
