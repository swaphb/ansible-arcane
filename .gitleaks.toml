[[rules]]
id = "arcane-plaintext-agent-token"
description = "Unencrypted arcane_agent_token value in YAML"
regex = '''(?i)^\s*arcane_agent_token\s*:\s*["']?(arc_(?:etkn_)?[^\s"'#]+|[^\s"'#]{8,})["']?'''
path = '''\.ya?ml(\.example)?$'''
secretGroup = 1
keywords = ["arcane_agent_token"]

  [[rules.allowlists]]
  regexTarget = "secret"
