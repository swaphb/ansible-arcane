---
- name: Check TUN device when Pangolin machine client is enabled
  ansible.builtin.stat:
    path: /dev/net/tun
  register: arcane_tun_device
  when: arcane_pangolin_client_enabled

- name: Require TUN device for Pangolin machine client
  ansible.builtin.assert:
    that: arcane_tun_device.stat.exists
    fail_msg: >-
      /dev/net/tun is required when arcane_pangolin_client_enabled is true.
      On Proxmox LXC, pass it through with: pct set <CTID> --dev0 /dev/net/tun
  when: arcane_pangolin_client_enabled

- name: Look up Arcane user account for PUID/PGID
  ansible.builtin.getent:
    database: passwd
    key: "{{ arcane_user }}"
  register: arcane_passwd_entry
  failed_when: false

- name: Resolve effective PUID and PGID for Arcane
  ansible.builtin.set_fact:
    arcane_effective_puid: >-
      {{
        arcane_puid | string
        if (arcane_puid | string | length > 0)
        else (
          ansible_facts.getent_passwd[arcane_user][1]
          if (ansible_facts.getent_passwd is defined and arcane_user in ansible_facts.getent_passwd)
          else '1000'
        )
      }}
    arcane_effective_pgid: >-
      {{
        arcane_pgid | string
        if (arcane_pgid | string | length > 0)
        else (
          ansible_facts.getent_passwd[arcane_user][2]
          if (ansible_facts.getent_passwd is defined and arcane_user in ansible_facts.getent_passwd)
          else '1000'
        )
      }}

- name: Create Arcane management directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ arcane_base_dir }}", owner: root, group: root, mode: "0750" }
    - { path: "{{ arcane_base_dir }}/secrets", owner: root, group: root, mode: "0700" }
    - { path: "{{ arcane_projects_dir }}", owner: "{{ arcane_effective_puid }}", group: "{{ arcane_effective_pgid }}", mode: "0755" }

- name: Create optional Arcane builds and backups directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ arcane_effective_puid }}"
    group: "{{ arcane_effective_pgid }}"
    mode: "0755"
  loop: "{{ [arcane_builds_dir, arcane_backups_dir] | select('truthy') | list }}"

- name: Generate and persist Arcane encryption key when not supplied
  ansible.builtin.shell: >-
    umask 077 && openssl rand -hex 32 > {{ arcane_base_dir }}/secrets/encryption-key
  args:
    creates: "{{ arcane_base_dir }}/secrets/encryption-key"
  no_log: true
  when: arcane_encryption_key | length == 0

- name: Read persisted Arcane encryption key
  ansible.builtin.slurp:
    src: "{{ arcane_base_dir }}/secrets/encryption-key"
  register: arcane_encryption_key_file
  no_log: true
  when: arcane_encryption_key | length == 0

- name: Set effective Arcane encryption key
  ansible.builtin.set_fact:
    arcane_effective_encryption_key: >-
      {{
        arcane_encryption_key
        if (arcane_encryption_key | length > 0)
        else (arcane_encryption_key_file.content | b64decode | trim)
      }}
  no_log: true

- name: Render Newt configuration secret
  ansible.builtin.template:
    src: newt-config.json.j2
    dest: "{{ arcane_base_dir }}/secrets/newt-config.json"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  when: arcane_newt_enabled
  notify: Restart Arcane stack
  tags: [newt]

- name: Render Arcane Docker Compose project
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ arcane_base_dir }}/compose.yml"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: Restart Arcane stack

- name: Start Arcane stack
  ansible.builtin.command:
    cmd: docker compose up -d --remove-orphans
    chdir: "{{ arcane_base_dir }}"
  register: arcane_compose_up
  changed_when: "'Started' in arcane_compose_up.stdout or 'Created' in arcane_compose_up.stdout"

- name: Flush handlers before running health check
  ansible.builtin.meta: flush_handlers

- name: Get Arcane container address for private health check
  ansible.builtin.command:
    argv:
      - docker
      - inspect
      - --format
      - "{{ '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' }}"
      - "{{ 'arcane-pangolin-client' if arcane_pangolin_client_enabled else 'arcane' }}"
  register: arcane_container_address
  changed_when: false
  when: arcane_newt_enabled

- name: Select Arcane health-check URL
  ansible.builtin.set_fact:
    arcane_health_url: >-
      {{
        'http://' + (arcane_container_address.stdout | trim) + ':3552/api/health'
        if arcane_newt_enabled
        else 'http://127.0.0.1:' + (arcane_port | string) + '/api/health'
      }}

- name: Wait for Arcane health endpoint
  ansible.builtin.uri:
    url: "{{ arcane_health_url }}"
    status_code: 200
  register: arcane_health
  retries: 30
  delay: 5
  until: arcane_health.status == 200
